# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # enable GitHub OIDC token issuance for this job

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 11.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal
    - name: Determine package version
      id: version
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      shell: bash
      run: |
        latest_tag="$(git tag --list 'v1.*' --sort=-version:refname | head -n 1)"
        if [[ -z "$latest_tag" ]]; then
          package_version="1.0.0"
        elif [[ "$latest_tag" =~ ^v1\.([0-9]+)\.([0-9]+)$ ]]; then
          package_version="1.${BASH_REMATCH[1]}.$((${BASH_REMATCH[2]} + 1))"
        else
          echo "Latest v1 release tag '$latest_tag' is not in the expected v1.MINOR.PATCH format." >&2
          exit 1
        fi
        echo "package_version=$package_version" >> "$GITHUB_OUTPUT"
    - name: Pack NuGet packages
      if: steps.version.outcome == 'success'
      run: |
        dotnet build MediatorMapper/MediatorMapper.csproj --configuration Release --no-restore -p:GeneratePackageOnBuild=false -p:PackageVersion=${{ steps.version.outputs.package_version }}
        dotnet build MediatorMapperGenerator/MediatorMapperGenerator.csproj --configuration Release --no-restore -p:GeneratePackageOnBuild=false -p:PackageVersion=${{ steps.version.outputs.package_version }}
        dotnet pack MediatorMapper/MediatorMapper.csproj --configuration Release --no-build --output artifacts -p:GeneratePackageOnBuild=false -p:PackageVersion=${{ steps.version.outputs.package_version }}
        dotnet pack MediatorMapperGenerator/MediatorMapperGenerator.csproj --configuration Release --no-build --output artifacts -p:GeneratePackageOnBuild=false -p:PackageVersion=${{ steps.version.outputs.package_version }}
    - name: Upload NuGet packages
      if: steps.version.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages-${{ steps.version.outputs.package_version }}
        path: artifacts/*.nupkg
        if-no-files-found: error
    - name: Create GitHub release
      if: steps.version.outcome == 'success'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.package_version }}
        name: v${{ steps.version.outputs.package_version }}
        generate_release_notes: true
        files: artifacts/*.nupkg
        fail_on_unmatched_files: true

        # Get a short-lived NuGet API key
    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: login
      with:
          user: martinjw-bot # Recommended: use a secret like ${{ secrets.NUGET_USER }} for your nuget.org username (profile name), NOT your email address
    
      # Push the package
    - name: NuGet push
      run: dotnet nuget push artifacts/MediatorMapper*.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json


